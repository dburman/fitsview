[package]
name = "fits-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FITS image parsing, stretching and calibration. No GUI dependencies."

[features]
# Exposes the synthetic FITS generator so the fitsview crate can use it in tests.
test-util = []

[dependencies]
log = "0.4.34"
rayon = "1.10.0"
thiserror = "2.0.20"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.5.1"
proptest = "1.8.0"
tempfile = "3.27.0"

[[bench]]
name = "read"
harness = false
required-features = ["test-util"]

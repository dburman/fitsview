[package]
name = "fitsview"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast cross-platform viewer for FITS astrophotography images."

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
env_logger = "0.11.11"
fits-core.workspace = true
log = "0.4.34"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
trash = "5.2.7"

[dev-dependencies]
criterion = "0.8.2"
fits-core = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"

[[bench]]
name = "display"
harness = false

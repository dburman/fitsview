name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting, lints and the unsafe guard do not vary by platform, so run them
  # once rather than three times.
  checks:
    name: Format, lints and unsafe guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: unsafe guard
        run: ./scripts/check-unsafe.sh
      - name: module check
        run: ./scripts/check-modules.sh

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On a private repository, Actions minutes bill at 2x for Windows and
        # 10x for macOS, so the full matrix would make those two roughly 80% of
        # the cost of every push. They run on the default branch, where a
        # cross-platform break matters, and on demand. Branches and pull
        # requests get Linux, which catches nearly everything.
        #
        # Run the full matrix on a branch with: gh workflow run CI --ref <branch>
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo build --release
        run: cargo build --release

      # A binary per platform, so a change can be tried without a toolchain.
      # Retained briefly: these are build outputs, not releases.
      - name: Name the binary
        id: binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "path=target/release/fitsview.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/release/fitsview" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: fitsview-${{ matrix.os }}
          path: ${{ steps.binary.outputs.path }}
          retention-days: 14
          if-no-files-found: error

  # A mermaid diagram that fails to parse renders on GitHub as "Unable to
  # render rich display", which is invisible when editing locally.
  docs:
    name: Documentation diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the mermaid parser
        run: npm install --no-save mermaid@11 jsdom
      - name: Check mermaid diagrams
        run: node scripts/check-mermaid.mjs README.md phasedbuild.md docs/*.md

  # The minimum supported Rust version declared in Cargo.toml must actually
  # build, otherwise the claim is decoration.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev
      - name: cargo check
        run: cargo check --workspace --all-features

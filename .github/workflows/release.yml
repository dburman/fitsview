name: Release

# Building a release is expensive on a private repository, where macOS minutes
# bill at 10x and Windows at 2x, so this runs only when a version tag is
# pushed rather than on every commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            binary: fitsview
          - os: macos-latest
            name: macos-arm64
            binary: fitsview
          - os: windows-latest
            name: windows-x86_64
            binary: fitsview.exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev

      # A release that fails its own tests is not worth publishing.
      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo build --release
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/
          cp README.md dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../fitsview-${{ matrix.name }}.zip" .
          else
            tar czf "../fitsview-${{ matrix.name }}.tar.gz" .
          fi

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: fitsview-${{ matrix.name }}
          path: |
            fitsview-${{ matrix.name }}.tar.gz
            fitsview-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Attach the binaries to the release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag produces a release; a manual run just builds the binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true

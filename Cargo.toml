[workspace]
members = ["crates/fits-core", "crates/fitsview"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dburman/fitsview"

[workspace.dependencies]
fits-core = { path = "crates/fits-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Build dependencies with optimisation even in debug builds. Without this,
# decoding a 24 MP image during development takes seconds instead of
# milliseconds, which makes the app unusable to develop against.
[profile.dev.package."*"]
opt-level = 3
